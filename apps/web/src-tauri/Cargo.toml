[package]
name = "mural-desktop"
version = "0.1.0"
description = "Mural for desktop: conversation practice with your OpenAI API key or a local Codex proxy."
edition = "2021"

[lib]
name = "mural_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
